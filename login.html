<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoRenta Pro — Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'DM Sans', sans-serif;
      background: linear-gradient(135deg, #0A0A0F 0%, #1A1A2E 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #F0EEF8;
    }
    
    .login-container {
      width: 100%;
      max-width: 400px;
      padding: 20px;
    }
    
    .login-card {
      background: #13131A;
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 14px;
      padding: 40px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    
    .login-header {
      text-align: center;
      margin-bottom: 32px;
    }
    
    .logo-text {
      font-family: 'Syne', sans-serif;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }
    
    .logo-text span {
      color: #C8B4FF;
    }
    
    .logo-subtitle {
      font-size: 12px;
      color: #8884A0;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    
    .form-group {
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
    }
    
    label {
      font-size: 12px;
      color: #8884A0;
      font-weight: 500;
      margin-bottom: 8px;
      letter-spacing: 0.3px;
      text-transform: uppercase;
    }
    
    input {
      background: #1A1A24;
      border: 1px solid rgba(255,255,255,0.07);
      color: #F0EEF8;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s;
      font-family: 'DM Sans', sans-serif;
    }
    
    input:focus {
      border-color: rgba(200, 180, 255, 0.4);
    }
    
    input::placeholder {
      color: #5A5870;
    }
    
    .btn-login {
      width: 100%;
      padding: 12px;
      background: #C8B4FF;
      color: #1A0A3D;
      border: none;
      border-radius: 8px;
      font-family: 'Syne', sans-serif;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
      margin-top: 8px;
    }
    
    .btn-login:hover {
      background: #D8C8FF;
      transform: translateY(-2px);
    }
    
    .btn-login:active {
      transform: translateY(0);
    }
    
    .alert {
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 13px;
      display: none;
    }
    
    .alert.show {
      display: block;
    }
    
    .alert.error {
      background: rgba(248, 113, 113, 0.1);
      color: #F87171;
      border: 1px solid rgba(248, 113, 113, 0.3);
    }
    
    .alert.success {
      background: rgba(74, 222, 128, 0.1);
      color: #4ADE80;
      border: 1px solid rgba(74, 222, 128, 0.3);
    }
    
    .loading {
      display: none;
      text-align: center;
      font-size: 12px;
      color: #8884A0;
      margin-top: 12px;
    }
    
    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(200, 180, 255, 0.3);
      border-top-color: #C8B4FF;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 6px;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .footer-text {
      text-align: center;
      font-size: 11px;
      color: #5A5870;
      margin-top: 24px;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="logo-text">Auto<span>Renta</span> Pro</div>
        <div class="logo-subtitle">Sistema de Gestión</div>
      </div>
      
      <div class="alert" id="alert-msg"></div>
      
      <form onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="username">Usuario</label>
          <input type="text" id="username" placeholder="Tu usuario" required>
        </div>
        
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" placeholder="Tu contraseña" required>
        </div>
        
        <button type="submit" class="btn-login">Entrar</button>
        
        <div class="loading" id="loading">
          <span class="spinner"></span>
          Verificando...
        </div>
      </form>
      
      <div class="footer-text">
        v1.0.0 · AutoRenta Pro
      </div>
    </div>
  </div>

  <script>
    // Cargar usuarios desde localStorage
    function loadUsers() {
      const users = localStorage.getItem('users');
      if (!users) {
        // Crear usuario admin por defecto
        const defaultUsers = {
          'admin': {
            password: btoa('admin123'), // Contraseña: admin123 (codificada en base64)
            role: 'admin'
          }
        };
        localStorage.setItem('users', JSON.stringify(defaultUsers));
        return defaultUsers;
      }
      return JSON.parse(users);
    }

    function handleLogin(event) {
      event.preventDefault();
      
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const alert = document.getElementById('alert-msg');
      const loading = document.getElementById('loading');
      
      loading.style.display = 'block';
      
      // Simular delay de procesamiento
      setTimeout(() => {
        const users = loadUsers();
        
        if (users[username] && users[username].password === btoa(password)) {
          // Login exitoso
          localStorage.setItem('currentUser', JSON.stringify({
            username: username,
            role: users[username].role
          }));
          alert.classList.remove('error');
          alert.classList.add('success', 'show');
          alert.textContent = '✓ Login exitoso. Redirigiendo...';
          
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 1000);
        } else {
          // Login fallido
          alert.classList.remove('success');
          alert.classList.add('error', 'show');
          alert.textContent = '✗ Usuario o contraseña incorrectos';
          loading.style.display = 'none';
        }
      }, 500);
    }

    // Al cargar la página, verificar si ya hay sesión activa
    window.addEventListener('load', () => {
      const currentUser = localStorage.getItem('currentUser');
      if (currentUser) {
        window.location.href = 'index.html';
      }
    });
  </script>
</body>
</html>
